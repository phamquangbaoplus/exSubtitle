name: Build and Package DMG

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          if [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Build App & Package DMG
        run: |
          chmod +x ./installer/build_dmg.sh
          ./installer/build_dmg.sh

      - name: Upload DMG to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exSubtitle-${{ env.RELEASE_VERSION }}
          path: build/dist/exSubtitle-${{ env.RELEASE_VERSION }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: exSubtitle v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: build/dist/exSubtitle-${{ env.RELEASE_VERSION }}.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
